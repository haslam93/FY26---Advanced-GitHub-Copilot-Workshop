<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop Work Item Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f1fb; color: #24212b; font-family: "Segoe UI", sans-serif; }
    header { padding: 18px 28px; background: #2d1950; color: white; }
    header h1 { margin: 0; font-size: 1.35rem; }
    main { width: min(860px, calc(100% - 32px)); margin: 32px auto; }
    .card { margin-bottom: 24px; padding: 28px; border-radius: 14px; background: white; box-shadow: 0 10px 30px rgba(45, 25, 80, 0.08); }
    h2 { margin-top: 0; color: #4c1d95; }
    label { display: block; margin: 16px 0 6px; font-weight: 650; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #756c85; border-radius: 8px; font: inherit; }
    input:focus, select:focus, textarea:focus { outline: 3px solid #c4b5fd; outline-offset: 1px; }
    button { margin-top: 20px; padding: 10px 18px; border: 0; border-radius: 8px; background: #6d28d9; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #5b21b6; }
    .error { display: none; margin-top: 5px; color: #b42318; }
    .error.visible { display: block; }
    #confirmation, #work-item-detail, #no-result { display: none; }
    #confirmation.visible, #work-item-detail.visible, #no-result.visible { display: block; }
    #confirmation { margin-top: 22px; padding: 16px; border-left: 5px solid #15803d; background: #ecfdf3; }
    #no-result { color: #b42318; }
    footer { padding: 24px; text-align: center; color: #655d70; }
  </style>
</head>
<body>
  <header><h1>Workshop Work Item Portal</h1></header>
  <main>
    <section class="card">
      <h2>Submit a work item</h2>
      <form id="work-item-form" novalidate>
        <label for="title">Title</label>
        <input id="title" name="title" aria-required="true">
        <span class="error" id="title-error" role="alert">Title is required</span>

        <label for="email">Owner email</label>
        <input id="email" name="email" type="email" aria-required="true">
        <span class="error" id="email-required-error" role="alert">Owner email is required</span>
        <span class="error" id="email-format-error" role="alert">Enter a valid email address</span>

        <label for="priority">Priority</label>
        <select id="priority" name="priority" aria-required="true">
          <option value="">Select a priority</option>
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
        </select>
        <span class="error" id="priority-error" role="alert">Priority is required</span>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3"></textarea>

        <button type="submit">Submit work item</button>
      </form>

      <div id="confirmation" role="status" aria-live="polite">
        <h3>Work item submitted</h3>
        <p>Reference: <strong id="confirmation-number" data-testid="confirmation-number"></strong></p>
      </div>
    </section>

    <section class="card">
      <h2>Find a work item</h2>
      <form id="search-form">
        <label for="search-id">Work item ID</label>
        <input id="search-id" name="workItemId" placeholder="W-000001">
        <button type="submit">Search</button>
      </form>
      <p id="no-result">No work item found with this ID</p>
      <div id="work-item-detail">
        <p>Status: <strong id="work-item-status" data-testid="work-item-status"></strong></p>
      </div>
    </section>
  </main>
  <footer>Neutral synthetic sample for workshop demonstrations</footer>
  <script>
    const workItems = {
      "W-000001": "OPEN",
      "W-000002": "IN PROGRESS",
      "W-000003": "COMPLETED"
    };

    document.querySelector("#work-item-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.querySelectorAll(".error").forEach((element) => element.classList.remove("visible"));

      const title = document.querySelector("#title").value.trim();
      const email = document.querySelector("#email").value.trim();
      const priority = document.querySelector("#priority").value;
      const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      let valid = true;

      if (!title) {
        document.querySelector("#title-error").classList.add("visible");
        valid = false;
      }
      if (!email) {
        document.querySelector("#email-required-error").classList.add("visible");
        valid = false;
      } else if (!validEmail) {
        document.querySelector("#email-format-error").classList.add("visible");
        valid = false;
      }
      if (!priority) {
        document.querySelector("#priority-error").classList.add("visible");
        valid = false;
      }

      if (valid) {
        const id = `W-${String(Math.floor(Math.random() * 999999)).padStart(6, "0")}`;
        document.querySelector("#confirmation-number").textContent = id;
        document.querySelector("#confirmation").classList.add("visible");
        document.querySelector("#work-item-form").hidden = true;
      }
    });

    document.querySelector("#search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const id = document.querySelector("#search-id").value.trim().toUpperCase();
      const detail = document.querySelector("#work-item-detail");
      const noResult = document.querySelector("#no-result");

      detail.classList.remove("visible");
      noResult.classList.remove("visible");

      if (workItems[id]) {
        document.querySelector("#work-item-status").textContent = workItems[id];
        detail.classList.add("visible");
      } else {
        noResult.classList.add("visible");
      }
    });
  </script>
</body>
</html>
